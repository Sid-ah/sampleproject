name: Dealership preview
on:
  push:
    branches: [dahmani-preview]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover original dealership assets
        run: python3 scripts/recover_assets.py
      - name: Save recovered assets
        run: |
          git config user.name "Copilot"
          git config user.email "223556219+Copilot@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Preserve dealership imagery for concept preview"
            git push
          fi
      - name: Verify public preview
        run: |
          URL="https://raw.githack.com/Sid-ah/sampleproject/$(git rev-parse HEAD)/index.html"
          curl --retry 4 --retry-delay 10 --fail -L "$URL" -o /tmp/preview.html
          grep -q "Dahmani" /tmp/preview.html
          echo "PREVIEW_URL=$URL"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser-test published preview
        run: PREVIEW_URL="https://raw.githack.com/Sid-ah/sampleproject/$(git rev-parse HEAD)/index.html" npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-screenshots
          path: test-results/
